name: PR Checks

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - main

jobs:
  checkpatch:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Fetch upstream main
        run: >-
          git fetch --no-tags https://github.com/riscv-software-src/librpmi.git
          main:refs/remotes/upstream/main
      - name: Test checkpatch wrapper
        run: scripts/test-checkpatch.sh
      - name: Run checkpatch on commits new in this PR
        run: >-
          scripts/checkpatch.sh
          "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          upstream/main

  commit-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate commit message prefixes
        run: |
          pattern='^(lib|include|test|docs|debian|build):'
          failed=0
          while IFS= read -r line; do
            sha="${line%% *}"
            subject="${line#* }"
            if ! echo "$subject" | grep -qE "$pattern"; then
              echo "FAIL [$sha]: $subject"
              failed=1
            fi
          done < <(git log --no-merges --format="%h %s" origin/${{ github.base_ref }}..HEAD)
          if [ $failed -ne 0 ]; then
            echo "Commit subjects must start with one of: lib: include: test: docs: debian: build:"
            exit 1
          fi

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'include/**'
              - 'Makefile'
              - 'README.md'
      - name: Install doxygen
        if: steps.changes.outputs.docs == 'true'
        run: sudo apt-get install -y doxygen graphviz
      - name: Build docs
        if: steps.changes.outputs.docs == 'true'
        run: make htmldocs
