# librpmi is not a Linux kernel tree.
--no-tree

# Project does not use a Linux kernel-style MAINTAINERS file; MAINTAINERS.md
# covers ownership instead.
--ignore=FILE_PATH_CHANGES

# include/librpmi.h is the public (uapi-style) header and consistently uses
# (1U << n) for flag bits; the BIT() macro is not available to external
# consumers. checkpatch already exempts include/uapi/ from this check.
--ignore=BIT_MACRO
